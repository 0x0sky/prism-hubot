name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  dispatch:
    name: Request infra deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      INFRA_REPOSITORY: aiaiaiai-org/infra
      WORKLOAD: prism-hubot
      RELEASE_REF: ${{ github.event.inputs.ref || 'master' }}
    steps:
      - name: Require infra dispatch credential
        env:
          INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$INFRA_DEPLOY_TOKEN" || {
            echo "::error::Missing production secret INFRA_DEPLOY_TOKEN."
            echo "::error::It must be able to create repository_dispatch events in aiaiaiai-org/infra."
            exit 1
          }

      - name: Validate requested ref
        env:
          RELEASE_REF: ${{ env.RELEASE_REF }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::Invalid release ref."
            exit 1
          }

      - name: Verify requested ref exists
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          RELEASE_REF: ${{ env.RELEASE_REF }}
        run: |
          set -Eeuo pipefail
          gh api --fail "/repos/aiaiaiai-org/prism-hubot/commits/$RELEASE_REF" --jq '.sha' >/dev/null

      - name: Dispatch contracted workload
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          RELEASE_REF: ${{ env.RELEASE_REF }}
        run: |
          set -Eeuo pipefail
          gh api             --method POST             "/repos/$INFRA_REPOSITORY/dispatches"             -f event_type=deploy-workload             -f 'client_payload[workload]=prism-hubot'             -f "client_payload[ref]=$RELEASE_REF"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Infra deployment requested"
            echo
            echo "- workload: `$WORKLOAD`"
            echo "- repository: `aiaiaiai-org/prism-hubot`"
            echo "- ref: `$RELEASE_REF`"
            echo "- target/runtime/path are resolved by `aiaiaiai-org/infra`"
            echo "- result: `${{ job.status }}`"
          } >> "$GITHUB_STEP_SUMMARY"
